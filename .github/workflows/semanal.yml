name: Semanal (parlamentares, PECs e tamanho do banco)

# Domingo às 4h41 de Brasília (7h41 UTC). Minuto fora de 0 de propósito (ver votacoes.yml).
on:
  schedule:
    - cron: "41 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Deputados
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-deputados.ts
      - name: Senadores
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-senadores.ts
      - name: PECs em andamento (varredura completa desde 1988)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-pecs.ts --completo
      - name: Tamanho do banco (falha acima de 400 MB)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/tamanho-banco.ts
      - name: Atualizar páginas
        if: ${{ success() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/revalidar.ts '/leis' '/leis/[aba]' '/parlamentares' '/parlamentares/senado' '/parlamentares/[id]'
      - name: Alerta de falha
        if: ${{ failure() }}
        uses: ./.github/actions/alerta-falha
        with:
          workflow: Semanal
          token: ${{ github.token }}
