name: Diário (despesas, CEAPS e proposições)

# Todo dia às 3h23 de Brasília (6h23 UTC). Minuto fora de 0 de propósito (ver votacoes.yml).
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      CAMARA_DESPESAS_CSV_URL: ${{ vars.CAMARA_DESPESAS_CSV_URL || secrets.CAMARA_DESPESAS_CSV_URL }}
      SENADO_CEAPS_URL: ${{ vars.SENADO_CEAPS_URL || secrets.SENADO_CEAPS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Despesas da Câmara
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-despesas.ts
      - name: Despesas do Senado (CEAPS)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-ceaps.ts
      - name: Proposições da Câmara
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-proposicoes.ts
      - name: Medidas provisórias
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-medidas-provisorias.ts
      - name: Proposições do Senado
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-proposicoes-senado.ts
      - name: Atualizar páginas
        if: ${{ success() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/revalidar.ts '/leis' '/leis/[aba]' '/leis/proposicao/[id]' '/parlamentares' '/parlamentares/senado' '/parlamentares/[id]'
      - name: Alerta de falha
        if: ${{ failure() }}
        uses: ./.github/actions/alerta-falha
        with:
          workflow: Diário
          token: ${{ github.token }}
