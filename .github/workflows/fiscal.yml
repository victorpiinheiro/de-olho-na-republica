name: Fiscal (arrecadação, detalhe por tributo e orçamento)

# Toda terça às 6h17 de Brasília (9h17 UTC). Os relatórios saem em datas variadas (Receita: mensal; Siconfi: por
# bimestre; DCA: uma vez por ano) e o agendador do GitHub perde execuções: rodando toda semana, o dado novo entra
# assim que a fonte publicar, sem depender de uma única execução no mês. Os jobs são idempotentes: sem dado novo,
# só confirmam. Minuto e horário fora do pico de propósito (o GitHub atrasa ou perde os agendamentos do início da hora).
on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fiscal
  cancel-in-progress: false

jobs:
  fiscal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      RECEITA_ANALISE_URL: ${{ vars.RECEITA_ANALISE_URL || secrets.RECEITA_ANALISE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      # Os relatórios da Receita são PDF, lidos com o `pdftotext`, que o computador do GitHub não traz instalado.
      - name: Instalar o leitor de PDF (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Arrecadação federal (Receita)
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-arrecadacao.ts
      - name: Arrecadação estadual (Siconfi, 27 UFs)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-arrecadacao-estados.ts
      - name: Orçamento da União (Siconfi)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-orcamento.ts
      - name: Arrecadação federal por tributo (Receita, Tabela I e VII)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-arrecadacao-detalhe.ts
      - name: Receita estadual bruta por imposto (DCA, anual)
        if: ${{ !cancelled() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/sync-receita-estadual.ts
      - name: Atualizar páginas
        if: ${{ success() }}
        run: npx tsx --tsconfig tsconfig.json src/jobs/revalidar.ts '/impostometro' '/orcamento'
      - name: Alerta de falha
        if: ${{ failure() }}
        uses: ./.github/actions/alerta-falha
        with:
          workflow: Fiscal
          token: ${{ github.token }}
